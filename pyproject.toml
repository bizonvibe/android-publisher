[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "android-instagram-publisher"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic-settings>=2.6,<3", "boto3>=1.36,<2", "uiautomator2>=3.2,<4", "portalocker>=3,<4", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["android_publisher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
