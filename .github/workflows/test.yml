name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m android_publisher --help
      - name: Validate Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PublisherParseErrors = $null
          $PublisherTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/Start-Publisher.ps1'),
            [ref]$PublisherTokens,
            [ref]$PublisherParseErrors
          ) | Out-Null
          if ($PublisherParseErrors.Count -gt 0) { throw ($PublisherParseErrors | Out-String) }
